name: income-etf-monitor

on:
  schedule:
    # 매주 토요일 08:00 KST = 금요일 23:00 UTC (미국 금요일 종가 반영 후)
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "임시 티커 목록 (공백/쉼표 구분, 비우면 기본값)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: income-etf-monitor
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: income_etf

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: income_etf/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: income_etf/requirements.txt
      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TICKERS: ${{ inputs.tickers }}
          TZ: "Asia/Seoul"
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TICKERS}" ]]; then
            if [[ ! "${INPUT_TICKERS}" =~ ^[A-Za-z0-9,[:space:]]+$ ]]; then
              echo "::error::tickers 입력 형식 오류 (영문·숫자·쉼표·공백만): ${INPUT_TICKERS}"
              exit 1
            fi
            export TICKERS="${INPUT_TICKERS}"
          fi
          python income_etf_monitor.py

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "chore: weekly income ETF snapshot"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"; exit 1

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$(printf '%s\n%s' '❌ income-etf-monitor 실행 실패' "${RUN_URL}")" \
            || true
