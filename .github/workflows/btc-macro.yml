name: BTC Macro Radar

on:
  schedule:
    - cron: "36 22 * * 1-5"   # KST 화~토 07:36 (미국 거래일 종가 반영, 혼잡대 회피)
    - cron: "13 0 * * 2-6"    # KST 화~토 09:13 백업 — 아침 슬롯이 밀리거나 빠질 때 따라잡기 (UTC 요일 = KST 요일)
    - cron: "43 1 * * 2-6"    # KST 화~토 10:43 백업 — 이미 오늘 스냅샷이 있으면 아래 gate가 건너뜀
  push:                       # (2026-11-10) GitHub 예약이 혼잡 시간대에 3~7시간씩 밀려서, swing-rebalancer의 매일
    branches: [main]          # 07:40 운영 점검이 오늘 스냅샷이 없으면 이 파일을 커밋해 바로 깨운다 (ops-atlas/tools/kick_briefs.py)
    paths: ["ops/kick/btc-macro.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-macro
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 최초 설치용 부트스트랩 제거(2026-09-07). 이 스텝은 매 실행마다
      # paste.rs 번들로 btc_macro/ 소스를 덮어써서, 레포에 직접 가한 수정이
      # 조용히 되돌아갔다(압축 규격 v1 적용분이 실제로 유실됨).
      # 소스는 이미 레포에 커밋돼 있으므로 checkout 이 정본이다.
      - name: Already collected today? (backup slots)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          TODAY="$(TZ=Asia/Seoul date +%F)"
          AS_OF="$(python3 -c "import json;print(json.load(open('btc_macro/data/latest.json')).get('as_of',''))" 2>/dev/null || true)"
          if [[ "$EVENT" == "schedule" && "$AS_OF" == "$TODAY" ]]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "오늘 스냅샷 이미 있음 ($AS_OF) - 수집 생략"
          fi

      - name: Test gate
        if: steps.gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          cd btc_macro && python3 -m unittest discover -s tests

      - name: Collect & render
        if: steps.gate.outputs.skip != '1'
        env:
          TZ: "Asia/Seoul"
        run: |
          set -euo pipefail
          python3 btc_macro/btc_macro.py

      - name: Commit snapshot
        if: always() && steps.gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_macro/btc_macro.py btc_macro/README.md btc_macro/tests btc_macro/.bundle_sha btc_macro/data docs/btc-macro 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          STAMP="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git commit -m "chore(btc-macro): snapshot ${STAMP} KST"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"; exit 1
