<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퍼프덱스 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#1C2430; --steel:#5B6B7F; --rule:#D5DCE4;
  --ok:#2F7F79; --watch:#6A7C93; --alert:#C98A12; --imm:#B83227; --none:#8A97A8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141A22;--paper:#1B232D;--ink:#E4E9EF;--steel:#8FA0B4;--rule:#2C3743;--ok:#4FB3AA;--watch:#8FA0B4;--alert:#E3AA3A;--imm:#E0604F;--none:#6B7A8C}
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--steel);font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;border-left-width:4px}
.card.NONE{border-left-color:var(--none)} .card.WATCH{border-left-color:var(--watch)}
.card.ALERT{border-left-color:var(--alert)} .card.IMMINENT{border-left-color:var(--imm)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .nm{font-weight:700;font-size:16px}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.pill.NONE{background:var(--none)} .pill.WATCH{background:var(--watch)} .pill.ALERT{background:var(--alert)} .pill.IMMINENT{background:var(--imm)}
.card .note{font-size:13px;color:var(--ink);margin:6px 0 0}
.card .odds{font-size:13px;color:var(--steel);margin:4px 0 0}
.card .up{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.card .up li{margin:2px 0;color:var(--steel)} .card .up li.near{color:var(--ink);font-weight:700}
.card .meta{font-size:12px;color:var(--steel);margin:6px 0 0}
.card .meta .bad{color:var(--imm)}
.card .last{font-size:13px;margin:6px 0 0;padding-top:6px;border-top:1px solid var(--rule)}
section{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:16px 0}
h2{font-size:15px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:14px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ev{display:grid;grid-template-columns:62px 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--rule)}
.ev:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;align-self:start;padding-top:1px}
.tag.ALERT{color:var(--alert)} .tag.IMMINENT{color:var(--imm)} .tag.WATCH{color:var(--watch)}
.ev .t{font-weight:500;overflow-wrap:anywhere} .ev .d,.ev .r{grid-column:2;color:var(--steel);font-size:13px;overflow-wrap:anywhere}
.ev.off{opacity:.5} .ev.off .t{text-decoration:line-through}
.empty{color:var(--steel);margin:0}
.src{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;margin:4px 0 10px}
.src .k{color:var(--steel)} .src .bad{color:var(--imm)} .src .good{color:var(--ok)}
.srchead{font-weight:700;font-size:13px;margin:8px 0 2px}
svg{display:block;width:100%;height:auto}
.chart-cap{font-size:13px;color:var(--steel);margin:6px 0 0}
details summary{cursor:pointer;color:var(--steel);font-size:13px}
a{color:inherit}
:focus-visible{outline:2px solid var(--alert);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>퍼프덱스 레이더</h1>
  <p class="sub" id="asof">불러오는 중</p>

  <div class="grid" id="venues" aria-label="거래소별 등급"></div>

  <section>
    <h2>최근 7일 신호</h2>
    <div class="chips" id="chips" role="group" aria-label="거래소 고르기"></div>
    <div id="events"></div>
  </section>

  <section id="charts"></section>

  <section>
    <details><summary>수집 원천 상태</summary><div id="src" style="margin-top:8px"></div></details>
  </section>

  <section>
    <details><summary>30일 전체 기록</summary><div id="all" style="margin-top:8px"></div></details>
  </section>
</main>
<script>
const LABEL={NONE:"조용함",WATCH:"관찰",ALERT:"경보",IMMINENT:"임박"};
const FAM={S1:"온체인",S2:"공식",S3:"앱",S4:"보조"};
const SRC={eth_transfers:"이더리움 LIT 이동",rh_supply:"RH LIT 총공급",rh_transfers:"RH LIT 이동",docs:"공식 문서",
  ann:"앱 공지",board:"포인트 리더보드",frontend:"앱 번들",js:"앱 코드",api:"포인트 API",telegram:"공식 텔레그램",
  blog:"공식 블로그",feed:"공식 블로그(RSS)",news:"뉴스",polymarket:"Polymarket"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 설정 문구의 **굵게** (메시지와 같은 규칙) — 이스케이프한 뒤에만 살린다 */
const noteHtml=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const oddsHtml=s=>esc(s).replace(/(\d+)%/g,(m,n)=>+n>=70?`<b>${m}</b>`:m);
const kst=t=>new Date(t*1000).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function fmt(n){return n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":n.toFixed(0)}
function srcName(k){return k.startsWith("x:")?"공식 X @"+k.slice(2):(SRC[k]||k)}
function spark(pts,col){
  if(!pts||pts.length<2)return '<p class="empty">이력이 쌓이는 중입니다.</p>';
  const W=700,H=140,P=8,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dy=(y1-y0)||1;
  const X=x=>P+(x-x0)/((x1-x0)||1)*(W-2*P),Y=y=>H-P-(y-y0)/dy*(H-2*P);
  const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="추이"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2"/></svg>
  <p class="chart-cap">최저 ${fmt(y0)} · 최고 ${fmt(y1)} · 현재 ${fmt(ys[ys.length-1])}</p>`;
}
function evRow(e){
  const ref=e.ref||{};
  const url=/^https?:/.test(ref.url||"")?String(ref.url).replace(/\.md$/,""):"";
  const src=url?` · <a href="${esc(url)}" rel="noopener">원문</a>`:"";
  const off=e.refuted?`<span class="r">${e.refute_kind==="false_positive"?"오탐":"해제"}: ${esc(e.refute_reason||"해제 조건 충족")}</span>`
    :(e.refute?`<span class="r">해제 조건: ${esc(e.refute)}</span>`:"");
  const vn=e.venue_name||e.venue||"";
  return `<div class="ev${e.refuted?" off":""}" data-venue="${esc(e.venue||"")}"><span class="tag ${e.grade}">${LABEL[e.grade]}</span>
  <span class="t">${vn?esc(vn)+" · ":""}${esc(FAM[e.family]||"")} · ${esc(e.title)}</span>
  <span class="d">${kst(e.ts)}${e.detail?" · "+esc(e.detail):""}${src}</span>
  ${off}</div>`;
}
let DATA=null, PICK="all";
function renderEvents(){
  const evs=[];
  for(const v of DATA.venues)for(const e of (v.events||[]))evs.push({...e,venue_name:v.name});
  evs.sort((a,b)=>b.ts-a.ts);
  const list=evs.filter(e=>PICK==="all"||e.venue===PICK);
  document.getElementById("events").innerHTML=list.length?list.slice(0,80).map(evRow).join(""):'<p class="empty">최근 7일 신호가 없습니다.</p>';
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.v===PICK)));
}
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  DATA=d;
  document.getElementById("asof").textContent=`${kst(d.generated_at)} KST 기준 · ${d.venues.length}곳 · 약 2시간마다 갱신`;
  document.getElementById("venues").innerHTML=d.venues.map(v=>{
    const last=(v.events||[]).filter(e=>e.grade==="ALERT"||e.grade==="IMMINENT")[0];
    const bad=Object.entries(v.sources||{}).filter(([k,s])=>!s.ok).map(([k])=>srcName(k));
    return `<article class="card ${v.level}"><div class="top"><span class="nm">${v.site?`<a href="${esc(v.site)}" rel="noopener">${esc(v.name)}</a>`:esc(v.name)}</span>
      <span class="pill ${v.level}">${LABEL[v.level]}</span></div>
      ${v.status_note?`<p class="note">${noteHtml(v.status_note)}</p>`:""}
      ${(v.upcoming||[]).length?`<ul class="up">${v.upcoming.map(u=>`<li class="${u.near?"near":""}">${esc(u.when)}${u.dday?" · "+esc(u.dday):""} — ${noteHtml(u.text)}</li>`).join("")}</ul>`:""}
      ${v.odds?`<p class="odds">${oddsHtml(v.odds)} · Polymarket</p>`:""}
      <p class="meta">수집 ${v.sources_ok}/${v.sources_all} 정상${bad.length?` · <span class="bad">안 됨: ${esc(bad.join(", "))}</span>`:""}</p>
      ${last?`<p class="last">${kst(last.ts)} · ${esc(last.title)}</p>`:""}</article>`;
  }).join("");
  document.getElementById("chips").innerHTML=[`<button class="chip" data-v="all">전체</button>`]
    .concat(d.venues.map(v=>`<button class="chip" data-v="${esc(v.id)}">${esc(v.name)}</button>`)).join("");
  document.getElementById("chips").addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;PICK=b.dataset.v;renderEvents()});
  renderEvents();
  const css=getComputedStyle(document.documentElement);
  const charts=[];
  for(const v of d.venues){
    if(v.rh_supply_hist)charts.push(`<h2>${esc(v.name)} · 로빈후드 체인 LIT 총공급</h2>${spark(v.rh_supply_hist,css.getPropertyValue("--alert"))}
      <p class="chart-cap">1,100만 LIT 풀이 로빈후드 체인으로 넘어오면 이 선이 계단처럼 뛴다.</p>`);
    if(v.lb_hist)charts.push(`<h2 style="margin-top:14px">${esc(v.name)} · 포인트 상위 10명 합계</h2>${spark(v.lb_hist.map(h=>[h[0],h[1]]),css.getPropertyValue("--ok"))}
      <p class="chart-cap">평평해지면 적립 정지, 꺾여 내려가면 시빌 정리 신호.</p>`);
  }
  const ch=document.getElementById("charts");
  if(charts.length)ch.innerHTML=charts.join("");else ch.remove();
  document.getElementById("src").innerHTML=d.venues.map(v=>`<div class="srchead">${esc(v.name)}</div><div class="src">`+
    Object.entries(v.sources||{}).map(([k,s])=>`<span class="k">${esc(srcName(k))}</span><span class="${s.ok?"good":"bad"}">${s.ok?"정상":"실패"}${s.note?" · "+esc(s.note):s.err?" · "+esc(s.err).slice(0,60):""}</span>`).join("")+`</div>`).join("");
  document.getElementById("all").innerHTML=(d.recent_all||[]).map(evRow).join("")||'<p class="empty">기록 없음</p>';
}).catch(()=>{document.getElementById("asof").textContent="데이터를 읽지 못했습니다. 다음 수집(약 2시간 주기) 뒤 다시 열어 주세요."});
</script>
</body>
</html>
